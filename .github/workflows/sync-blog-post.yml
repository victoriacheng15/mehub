name: Sync Blog Post
on:
  repository_dispatch:
    types: [sync-blog-post]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ID: ${{ github.event.client_payload.issue_id }}
      BLOG_TITLE: ${{ github.event.client_payload.issue_title }}
      SYNC_BLOG_TOKEN: ${{ secrets.SYNC_BLOG_TOKEN }}
      API_LINK: ${{ vars.API_LINK }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync post
        id: sync_script
        run: ./scripts/sync_blog_post.sh

      - name: Commit and open pull request
        if: steps.sync_script.outputs.slug != ''
        uses: ./.github/actions/commit-and-pr
        with:
          path: blog/
          branch_prefix: "blog/${{ steps.sync_script.outputs.slug }}"
          commit_message: "Sync blog post: ${{ steps.sync_script.outputs.post_title }}"
          pr_title: "Sync Blog Post: ${{ steps.sync_script.outputs.post_title }}"
          pr_body: "This PR syncs the blog post titled **${{ steps.sync_script.outputs.post_title }}** from the API. 🎉"
          pr_label: blog
          github_token: ${{ secrets.GITHUB_TOKEN }}