name: Update Contributions

on:
  schedule:
    - cron: '45 0 * * 1,4,6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      PROJECTS_YAML_PATH: internal/templates/contents/projects.yaml
      UPDATE_MESSAGE: 'chore(contribution): update open source contributions'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch latest contributions
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_BLOG_TOKEN }}
        run: python3 scripts/fetch_contributions.py

      - name: Commit and open pull request
        uses: ./.github/actions/commit-and-pr
        with:
          path: ${{ env.PROJECTS_YAML_PATH }}
          branch_prefix: chore/update-contributions
          commit_message: ${{ env.UPDATE_MESSAGE }}
          pr_title: ${{ env.UPDATE_MESSAGE }}
          pr_body: "Updates the open source contributions section in projects.yaml. Generated by scripts/fetch_contributions.py."
          github_token: ${{ secrets.GITHUB_TOKEN }}

