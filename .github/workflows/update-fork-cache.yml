name: Update Fork Cache

on:
  schedule:
    - cron: '30 0 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      CACHE_FILE_PATH: scripts/fork_cache.json
      UPDATE_MESSAGE: 'chore(cache): update fork cache'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set branch name
        run: echo "BRANCH_NAME=chore/update-fork-cache-$(date +%s)" >> "$GITHUB_ENV"

      - name: Run update fork cache script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_fork_cache.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- "$CACHE_FILE_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push cache updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add "$CACHE_FILE_PATH"
          git commit -m "$UPDATE_MESSAGE"
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Open or update fork cache update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "$BRANCH_NAME" --base main --json number --jq .number >/dev/null 2>&1; then
            echo "Pull request already exists for $BRANCH_NAME."
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$UPDATE_MESSAGE" \
              --body "Updates the fork parent repository cache in scripts/fork_cache.json. Generated by scripts/update_fork_cache.py."
          fi
