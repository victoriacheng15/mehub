name: Update Fork Cache

on:
  schedule:
    - cron: '30 0 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      CACHE_FILE_PATH: scripts/fork_cache.json
      UPDATE_MESSAGE: 'chore(cache): update fork cache'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run update fork cache script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_fork_cache.py

      - name: Commit and open pull request
        uses: ./.github/actions/commit-and-pr
        with:
          path: ${{ env.CACHE_FILE_PATH }}
          branch_prefix: chore/update-fork-cache
          commit_message: ${{ env.UPDATE_MESSAGE }}
          pr_title: ${{ env.UPDATE_MESSAGE }}
          pr_body: "Updates the fork parent repository cache in scripts/fork_cache.json. Generated by scripts/update_fork_cache.py."
          github_token: ${{ secrets.GITHUB_TOKEN }}

